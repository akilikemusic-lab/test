<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>睡眠健康アプリ v0.1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>睡眠健康アプリ</h1>
    <p class="version">v0.1</p>

    <section class="card">
      <h2>今日の記録</h2>

      <label for="date">日付</label>
      <input type="date" id="date">

      <label for="sleepDuration">睡眠時間（分）</label>
      <input type="number" id="sleepDuration" min="0" placeholder="例：450">

      <p class="hint">例：7時間30分 → 450分</p>

      <label for="rhythmGameCondition">音ゲーの調子</label>
      <select id="rhythmGameCondition">
        <option value="">選択してください</option>
        <option value="1">1：非常に悪い</option>
        <option value="2">2：悪い</option>
        <option value="3">3：普通</option>
        <option value="4">4：良い</option>
        <option value="5">5：非常に良い</option>
      </select>

      <label for="physicalCondition">体調</label>
      <select id="physicalCondition">
        <option value="">選択してください</option>
        <option value="1">1：非常に悪い</option>
        <option value="2">2：悪い</option>
        <option value="3">3：普通</option>
        <option value="4">4：良い</option>
        <option value="5">5：非常に良い</option>
      </select>

      <label for="beverage">飲料</label>
      <select id="beverage">
        <option value="">なし・未入力</option>
        <option value="水">水</option>
        <option value="コーヒー">コーヒー</option>
        <option value="お茶">お茶</option>
        <option value="エナジードリンク">エナジードリンク</option>
        <option value="その他">その他</option>
      </select>

      <label for="notes">メモ</label>
      <textarea id="notes" rows="4" placeholder="気になったことがあれば入力してください"></textarea>

      <button id="saveButton" type="button">保存する</button>

      <p id="message" class="message"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
