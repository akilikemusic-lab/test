<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>睡眠健康アプリ v0.3</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="睡眠記録">
</head>
<body>
  <main class="container">
    <h1>睡眠健康アプリ</h1>
    <p class="version">v0.3</p>

    <section class="card">
      <h2>今日の記録</h2>

      <!--           日付             -->
      <label for="date">日付</label>
      <input type="date" id="date">

      <label for="sleepDuration">睡眠時間（分）</label>
      <input type="number" id="sleepDuration" min="0" placeholder="例：450">

      <p class="hint">例：7時間30分 → 450分</p>

      <label for="rhythmGameCondition">音ゲーの調子</label>
      <select id="rhythmGameCondition">
        <option value="">選択してください</option>
        <option value="1">1：非常に悪い</option>
        <option value="2">2：悪い</option>
        <option value="3">3：普通</option>
        <option value="4">4：良い</option>
        <option value="5">5：非常に良い</option>
      </select>

      <label for="physicalCondition">体調</label>
      <select id="physicalCondition">
        <option value="">選択してください</option>
        <option value="1">1：非常に悪い</option>
        <option value="2">2：悪い</option>
        <option value="3">3：普通</option>
        <option value="4">4：良い</option>
        <option value="5">5：非常に良い</option>
      </select>

      <label for="beverage">飲料</label>
      <select id="beverage">
        <option value="">なし・未入力</option>
        <option value="水">水</option>
        <option value="コーヒー">コーヒー</option>
        <option value="お茶">お茶</option>
        <option value="エナジードリンク">エナジードリンク</option>
        <option value="その他">その他</option>
      </select>

      <label for="notes">メモ</label>
      <textarea id="notes" rows="4" placeholder="気になったことがあれば入力してください"></textarea>

  <h2>画像から読み取る</h2>
      <input type="file" id="imageInput" accept="image/*">
  <br><br>
      <img id="imagePreview" style="max-width: 100%; display: none;">
  <button id="ocrButton"> OCRを実行 </button>
  <h3>OCR結果</h3>
  <pre id="ocrResult"></pre>

      <button id="saveButton" type="button">保存する</button>

      <p id="message" class="message"></p>
    </section>
  </main>

  <!--           Tesseract.jsの役割文 OCR処理             -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
